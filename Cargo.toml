[package]
name = "auction"
version = "0.1.0"
edition = "2024"

[dependencies]
scylla = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid"] }
async-trait = "0.1"
uuid = "1"
anyhow = "1"